<!doctype html><html><head><base target="_blank"><style>
body{font:14px/1.45 Arial,sans-serif;margin:0;color:#172033;background:#f5f7fa}.app{padding:16px}.card{background:#fff;border:1px solid #d7dde6;border-radius:14px;padding:17px;box-shadow:0 4px 18px #17203312}h1{font-size:21px;margin:0 0 6px}h2{font-size:16px;margin:20px 0 8px}.muted{color:#5f6b7a}label{display:block;font-weight:600;margin:11px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aeb8c5;border-radius:8px;background:#fff}.button{border:0;border-radius:9px;padding:11px 14px;background:#17224a;color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.secondary{background:#e8edf5;color:#172033}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8f0fe;color:#164b85;font-size:12px}.person{border-top:1px solid #e4e8ef;padding-top:12px;margin-top:14px}.field{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;align-items:center;margin:7px 0}.field label{margin:0;font-weight:500}.checks{display:grid;grid-template-columns:1fr 1fr;gap:5px}.checks label{font-weight:400;margin:2px}.checks input{width:auto}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.total{background:#f3f6fa;border-radius:8px;padding:8px;text-align:center}.total strong{display:block}.error{color:#a21d2f;margin-top:10px}.success{color:#126b38;margin-top:10px}
</style></head><body><div class="app"><div class="card" id="app"><p>Caricamento…</p></div></div><script>
const MODE='<?!= modalita ?>';let ctx={};let booking=null;const call=(name,arg)=>new Promise((ok,no)=>{let r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)));arg===undefined?r[name]():r[name](arg)});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){try{ctx=await call('caricaContestoSegreteria');MODE==='ELENCO'?listUI():bookingUI()}catch(e){showError(e)}}
function bookingUI(){app().innerHTML=`<span class="pill">Segreteria</span><h1>Scheda prenotazione</h1><p class="muted">Scegli una prenotazione: vedrai insieme tutti i partecipanti.</p><label>Prenotazione</label><select id="order"><option value="">Scegli…</option>${ctx.registrations.map(x=>`<option value="${esc(x.order_code)}">${esc(x.label)} · ${esc(x.status)}</option>`).join('')}</select><button class="button" onclick="loadBooking()">Apri scheda</button><div id="message"></div>`}
async function loadBooking(){try{booking=await call('caricaSchedaPrenotazione',value('order'));renderBooking()}catch(e){showError(e)}}
function renderBooking(){app().innerHTML=`<span class="pill">${esc(booking.status)}</span><h1>${esc(booking.event_title)}</h1><p><strong>${esc(booking.order_code)}</strong> · ${esc(booking.buyer.first_name)} ${esc(booking.buyer.last_name)}<br><span class="muted">${esc(booking.buyer.email)} · ${esc(booking.buyer.phone)}</span></p><div class="totals"><div class="total">Totale<strong>${money(booking.total_cents)}</strong></div><div class="total">Versato<strong>${money(booking.paid_cents)}</strong></div><div class="total">Saldo<strong>${money(booking.balance_cents)}</strong></div></div>${booking.participants.map(personCard).join('')}<label>Motivo delle modifiche</label><textarea id="reason" rows="2" placeholder="Es. comunicato telefonicamente"></textarea><button class="button" onclick="saveBooking()">Conferma modifiche</button><button class="button secondary" onclick="bookingUI()">Torna alla ricerca</button><div id="message"></div>`}
function personCard(p){const entries=Object.entries(p.fields||{});return `<section class="person"><h2>${p.number}. ${esc(p.first_name)} ${esc(p.last_name)}</h2><p class="muted">${esc(p.ticket_type)} · ${esc(p.status)}</p>${entries.length?entries.map(([k,v])=>`<div class="field"><label>${esc(readable(k))}</label><input data-change data-person="${p.number}" data-key="${esc(k)}" value="${esc(v)}" data-original="${esc(v)}"></div>`).join(''):'<p class="muted">Nessun dato aggiuntivo raccolto.</p>'}${(p.options||[]).length?`<p><strong>Opzioni:</strong> ${esc(p.options.map(x=>x.name||x.label||x.code).filter(Boolean).join(', '))}</p>`:''}</section>`}
async function saveBooking(){const changes=[...document.querySelectorAll('[data-change]')].filter(x=>x.value!==x.dataset.original).map(x=>({participant_number:Number(x.dataset.person),key:x.dataset.key,value:x.value}));if(!changes.length){message('Nessuna modifica da confermare.');return}try{const r=await call('salvaModifichePrenotazione',{order_code:booking.order_code,changes:changes,reason:value('reason')});message(r.message,true);booking=await call('caricaSchedaPrenotazione',booking.order_code)}catch(e){showError(e)}}
function listUI(){const defaults=['participant_number','first_name','last_name','status','phone','room','transport','balance'];app().innerHTML=`<span class="pill">Vista operativa</span><h1>Crea un elenco utile</h1><p class="muted">Scegli soltanto le colonne che servono per questo evento.</p><label>Evento</label><select id="event" onchange="loadSelection()"><option value="">Scegli…</option>${ctx.events.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select><h2>Colonne</h2><div class="checks">${ctx.available_fields.map(x=>`<label><input type="checkbox" name="column" value="${esc(x.key)}" ${defaults.includes(x.key)?'checked':''}>${esc(x.label)}</label>`).join('')}</div><button class="button" onclick="createList()">Genera elenco operativo</button><div id="message"></div>`}
function loadSelection(){const selected=ctx.views[value('event')]||[];if(!selected.length)return;document.querySelectorAll('[name=column]').forEach(x=>x.checked=selected.includes(x.value))}async function createList(){try{const fields=[...document.querySelectorAll('[name=column]:checked')].map(x=>x.value);const r=await call('configuraElencoOperativo',{event_id:value('event'),fields:fields});message(r.message+' Apri la scheda “'+r.sheet_name+'”.',true)}catch(e){showError(e)}}
function readable(s){return String(s).replace(/^custom_/,'').replaceAll('_',' ').replace(/^./,c=>c.toUpperCase())}function money(c){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format((Number(c)||0)/100)}function value(id){return document.getElementById(id)?.value||''}function app(){return document.getElementById('app')}function message(text,ok=false){const n=document.getElementById('message');n.className=ok?'success':'muted';n.textContent=text}function showError(e){const n=document.getElementById('message')||app();n.className='error';n.textContent=e.message||String(e)}boot();
</script></body></html>
