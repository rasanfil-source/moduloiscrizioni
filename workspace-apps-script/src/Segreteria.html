<!doctype html><html><head><base target="_blank"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--navy:#17224a;--ink:#172033;--muted:#657084;--line:#d9dee7;--blue:#dcecff;--green:#d9f2d7;--green-ink:#176b25;--yellow:#ffe2a8;--yellow-ink:#7a4d00;--red:#ffd6d6;--red-ink:#9b2020;--canvas:#f5f7fa}*{box-sizing:border-box}body{font:14px/1.42 Arial,sans-serif;margin:0;color:var(--ink);background:var(--canvas)}button,input,select,textarea{font:inherit}.app{padding:12px}.panel{max-width:720px;margin:auto}.toolbar{position:sticky;top:0;z-index:3;padding:4px 0 10px;background:var(--canvas)}h1{font-size:21px;line-height:1.15;margin:0 0 5px}h2{font-size:16px;margin:18px 0 8px}.muted{color:var(--muted)}.stack{display:grid;gap:9px}.search{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:7px}.search input,.control{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 5px;scrollbar-width:thin}.chips select{flex:0 0 auto;width:auto;max-width:190px;min-height:40px;padding:8px;border:1px solid var(--line);border-radius:999px;background:#fff}.booking-card{display:grid;width:100%;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.booking-card:hover,.booking-card:focus{border-color:var(--navy);box-shadow:0 4px 14px #17203312}.avatar{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:var(--blue);font-weight:800}.booking-card strong{display:block;font-size:15px}.booking-card small{display:block;color:#555;overflow-wrap:anywhere}.pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;background:var(--blue);color:#164b85;font-size:11px;font-weight:750}.pill.green{background:var(--green);color:var(--green-ink)}.pill.yellow{background:var(--yellow);color:var(--yellow-ink)}.pill.red{background:var(--red);color:var(--red-ink)}.card{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff}.header-card{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;align-items:center}.header-card .avatar{width:46px;height:46px;background:var(--yellow)}.pills{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.progress-label{display:flex;justify-content:space-between;gap:12px}.progress{height:7px;margin:7px 0 14px;border-radius:99px;background:#edf0f4;overflow:hidden}.progress span{display:block;height:100%;background:#ffb916}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions.single{grid-template-columns:1fr}.button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;width:100%;padding:10px 13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:750;cursor:pointer;text-decoration:none}.button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.button.danger{background:#9f1e33}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.segmented label{display:flex;min-height:42px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.segmented input{position:absolute;opacity:0}.segmented label:has(input:checked){border-color:#6aa7f7;background:var(--blue);color:#174d8b}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick button{min-height:36px;border:1px solid var(--line);border-radius:9px;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-grid .wide{grid-column:1/-1}label.field-label{display:block;margin:9px 0 4px;font-weight:700}.person{margin-top:12px;padding-top:12px;border-top:1px solid #e9ecf1}.person h2{margin:0}.field-row{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.2fr);gap:8px;align-items:center;margin:7px 0}.field-row label{color:#4d5868}.field-row input{width:100%;min-height:40px;padding:8px;border:1px solid var(--line);border-radius:8px}.room-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.message{margin-top:10px;padding:9px;border-radius:9px;background:#edf2f8}.message.error{background:#ffe5e8;color:#982037}.empty{padding:24px 10px;text-align:center;color:var(--muted)}.checks{display:grid;gap:6px}.checks label{display:flex;gap:8px;align-items:center;padding:7px;border-radius:8px;background:#fff}.checks input{width:18px;height:18px}.hidden{display:none!important}@media(max-width:430px){.actions,.form-grid,.quick{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.field-row{grid-template-columns:1fr}.booking-card{grid-template-columns:40px minmax(0,1fr)}.booking-card>.pill{grid-column:2;justify-self:start}.app{padding:10px}}
</style></head><body data-mode="<?!= modalita ?>"><div class="app"><main id="app" class="panel"><p>Caricamento…</p></main></div><script>
const MODE='<?!= modalita ?>',INITIAL_ORDER='<?!= codiceOrdineIniziale ?>',IS_WEB_APP=<?!= isWebApp ? 'true' : 'false' ?>,WEB_APP_URL='<?!= webAppUrl ?>';let ctx={},booking=null,installment='NON_ASSEGNATO',operationalEmailMode='ANTEPRIMA',communicationRequestId='comui-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const call=(name,arg)=>new Promise((ok,no)=>{let r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)));arg===undefined?r[name]():r[name](arg)}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){try{ctx=await call('caricaContestoSegreteria');if(MODE==='PRENOTAZIONE')await loadBooking(INITIAL_ORDER);else if(MODE==='ELENCO')listConfigUI();else if(MODE==='COMUNICAZIONI')communicationsUI();else listUI()}catch(e){showError(e)}}
function app(){return document.getElementById('app')}function value(id){return document.getElementById(id)?.value||''}function money(c){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format((Number(c)||0)/100)}function initials(a,b){return ((a||'').slice(0,1)+(b||'').slice(0,1)).toUpperCase()||'?' }function statusClass(code){return /ANNULL|SCAD|CANCEL|EXPIRE/.test(code)?'red':/SALDAT|CONFERM|CAPARRA_RICEVUTA|GRATUITO/.test(code)?'green':/DOVUTA|PARZIALE|ATTESA|DA_PAGARE/.test(code)?'yellow':''}
function message(text,ok=true){let n=document.getElementById('message');if(!n){n=document.createElement('div');n.id='message';app().appendChild(n)}n.className='message'+(ok?'':' error');n.textContent=text}function showError(e){message(e.message||String(e),false)}
function eventOptions(){return `<option value="">Tutti gli eventi</option>${ctx.events.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}`}
function listUI(){app().innerHTML=`<div class="toolbar"><h1>Segreteria eventi</h1><div class="search"><input id="query" placeholder="Nome o codice ordine" aria-label="Cerca prenotazione"><button class="button" onclick="searchBookings()" aria-label="Cerca">Cerca</button></div><div class="chips"><select id="event" onchange="searchBookings()">${eventOptions()}</select><select id="payment" onchange="searchBookings()"><option value="">Tutti gli stati</option><option value="CAPARRA_DOVUTA">Caparra dovuta</option><option value="CAPARRA_RICEVUTA">Caparra ricevuta</option><option value="SALDATO">Saldato</option><option value="GRATUITO">Gratuito</option></select><select id="room" onchange="searchBookings()"><option value="">Tutte le camere</option><option value="non assegnata">Non assegnata</option></select></div></div><div id="results"><p class="empty">Cerca per nome oppure scegli un evento.</p></div><div id="message"></div>`;document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchBookings()});searchBookings()}
async function searchBookings(){try{const r=await call('cercaPrenotazioniSegreteria',{query:value('query'),event_id:value('event'),payment_status:value('payment'),room:value('room'),limit:30});const target=document.getElementById('results');target.innerHTML=r.items.length?`<div class="stack">${r.items.map(bookingCard).join('')}</div>${r.has_more?'<p class="muted">Mostrati i primi 30 risultati: restringi la ricerca.</p>':''}`:'<p class="empty">Nessuna prenotazione trovata.</p>'}catch(e){showError(e)}}
function bookingCard(x){return `<button class="booking-card" data-order="${esc(x.order_code)}" onclick="openBooking(this.dataset.order)"><span class="avatar">${esc(initials(x.first_name,x.last_name))}</span><span><strong>${esc(x.first_name)} ${esc(x.last_name)}</strong><small>${esc(x.event_title)} · ${esc(x.room||'Camera non assegnata')}</small></span><span class="pill ${statusClass(x.payment_status.code)}">${esc(x.payment_status.label)}</span></button>`}
async function openBooking(code){if(IS_WEB_APP){location.href=WEB_APP_URL+'?view=segreteria&order='+encodeURIComponent(code);return}try{await call('apriDialogoPrenotazione',code)}catch(e){showError(e)}}
async function loadBooking(code){try{booking=await call('caricaSchedaPrenotazione',code);renderBooking()}catch(e){showError(e)}}
function renderBooking(){const lead=booking.participants[0]||{};const pct=booking.total_cents?Math.min(100,Math.max(0,Math.round(booking.paid_cents/booking.total_cents*100))):100;const paymentAction=booking.total_cents?`<button class="button secondary" onclick="toggle('paymentForm')">Aggiungi versamento</button>`:'';const requests=booking.special_requests?`<div class="field-row"><label>Richieste particolari</label><strong>${esc(booking.special_requests)}</strong></div>`:'';app().innerHTML=`<section class="card header-card"><span class="avatar">${esc(initials(lead.first_name,lead.last_name))}</span><div><h1>${esc(lead.first_name)} ${esc(lead.last_name)}</h1><span class="muted">${esc(booking.order_code)} · ${esc(booking.event_title)}</span></div></section><div class="pills"><span class="pill ${statusClass(booking.status)}">${esc(registrationStatus(booking.status))}</span><span class="pill ${statusClass(booking.payment_status.code)}">${esc(booking.payment_status.label)}</span></div><div class="progress-label"><span>Versato ${money(booking.paid_cents)}</span><span>su ${money(booking.total_cents)}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="actions ${booking.total_cents?'':'single'}">${paymentAction}<button class="button secondary" onclick="toggle('roomForm')">Cambia camera</button></div>${booking.total_cents?paymentForm():''}${roomForm()}<section class="card"><h2>Dati della prenotazione</h2><p class="muted">${esc(booking.buyer.email)} · ${esc(booking.buyer.phone)}</p>${requests}${booking.participants.map(personCard).join('')}<label class="field-label" for="reason">Motivo delle modifiche</label><textarea class="control" id="reason" rows="2" placeholder="Es. comunicato telefonicamente"></textarea><button class="button" onclick="saveBooking()">Conferma modifiche</button></section><div id="message"></div>`}
function paymentForm(){return `<section id="paymentForm" class="card hidden"><h2>Nuovo versamento</h2><div class="segmented">${['CONTANTE','BONIFICO','CARTA'].map((x,i)=>`<label><input type="radio" name="source" value="${x}" ${i===0?'checked':''}>${x[0]+x.slice(1).toLowerCase()}</label>`).join('')}</div><label class="field-label" for="amount">Importo</label><input class="control" id="amount" inputmode="decimal" placeholder="0,00"><div class="quick"><button onclick="quickAmount(${booking.deposit_cents},'CAPARRA')">Caparra ${money(booking.deposit_cents)}</button><button onclick="quickAmount(${booking.balance_cents},'SALDO')">Saldo ${money(booking.balance_cents)}</button></div>${booking.active_operator?'':`<label class="field-label" for="operator">Operatore</label><input class="control" id="operator" placeholder="Nome dell’operatore">`}<label class="field-label" for="paymentNote">Nota facoltativa</label><input class="control" id="paymentNote" placeholder="Nessun numero completo di carta"><button class="button" onclick="recordPayment()">Registra versamento</button></section>`}
function roomForm(){if(!booking.accommodations.length)return '<section id="roomForm" class="card hidden"><p class="muted">Configura prima le sistemazioni nel foglio “Sistemazioni”.</p></section>';return `<section id="roomForm" class="card hidden"><h2>Sistemazioni</h2>${booking.participants.map(p=>`<label class="field-label">${esc(p.first_name)} ${esc(p.last_name)}</label><div class="room-row"><select class="control" id="room-${p.number}"><option value="">Scegli…</option>${booking.accommodations.map(r=>`<option value="${esc(r.code)}" ${p.room===r.code?'selected':''} ${r.available<1&&p.room!==r.code?'disabled':''}>${esc(r.name)} · ${r.available} posti liberi</option>`).join('')}</select><button class="button secondary" onclick="changeRoom(${p.number})">Salva</button></div>`).join('')}</section>`}
function personCard(p){const entries=Object.entries(p.fields||{});const options=(p.options||[]).map(x=>displayValue(x.name||x.label||x.code||x)).filter(Boolean);return `<section class="person"><h2>${esc(p.first_name)} ${esc(p.last_name)}</h2><p class="muted">${esc(p.ticket_type)} · ${esc(registrationStatus(p.status))}${p.room?' · '+esc(p.room):''}</p>${entries.map(([k,v])=>{const shown=displayValue(v);return `<div class="field-row"><label>${esc(readable(k))}</label><input data-change data-person="${p.number}" data-key="${esc(k)}" value="${esc(shown)}" data-original="${esc(shown)}"></div>`}).join('')}${options.length?`<div class="field-row"><label>Opzioni</label><strong>${esc(options.join(', '))}</strong></div>`:''}${!entries.length&&!options.length?'<p class="muted">Nessun dato aggiuntivo raccolto.</p>':''}</section>`}
function toggle(id){document.getElementById(id)?.classList.toggle('hidden')}function quickAmount(c,kind){document.getElementById('amount').value=(Number(c||0)/100).toFixed(2).replace('.',',');installment=kind}
async function recordPayment(){try{const source=document.querySelector('[name=source]:checked')?.value||'';await call('registraVersamentoSegreteria',{request_id:'ui-'+Date.now()+'-'+Math.random().toString(36).slice(2),order_code:booking.order_code,amount:value('amount'),payment_source:source,installment_kind:installment,operator_label:value('operator'),administrative_note:value('paymentNote')});booking=await call('caricaSchedaPrenotazione',booking.order_code);renderBooking();message('Versamento registrato.',true)}catch(e){showError(e)}}
async function changeRoom(number){try{await call('cambiaSistemazioneSegreteria',{order_code:booking.order_code,participant_number:number,room_code:value('room-'+number),reason:value('reason')});booking=await call('caricaSchedaPrenotazione',booking.order_code);renderBooking();message('Sistemazione aggiornata.',true)}catch(e){showError(e)}}
async function saveBooking(){const changes=[...document.querySelectorAll('[data-change]')].filter(x=>x.value!==x.dataset.original).map(x=>({participant_number:Number(x.dataset.person),key:x.dataset.key,value:x.value}));if(!changes.length){message('Nessuna modifica da confermare.',false);return}try{await call('salvaModifichePrenotazione',{order_code:booking.order_code,changes:changes,reason:value('reason')});booking=await call('caricaSchedaPrenotazione',booking.order_code);renderBooking();message('Modifiche confermate.',true)}catch(e){showError(e)}}
function listConfigUI(){const defaults=['participant_number','first_name','last_name','status','phone','room','transport'];app().innerHTML=`<h1>Elenco operativo</h1><p class="muted">Scegli soltanto i dati utili sul campo.</p><label class="field-label">Evento</label><select class="control" id="event" onchange="loadSelection()"><option value="">Scegli…</option>${ctx.events.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select><h2>Colonne</h2><div class="checks">${ctx.available_fields.map(x=>`<label><input type="checkbox" name="column" value="${esc(x.key)}" ${defaults.includes(x.key)?'checked':''}>${esc(x.label)}</label>`).join('')}</div><button class="button" onclick="createList()">Genera elenco stampabile</button><div id="message"></div>`}
function loadSelection(){const selected=ctx.views[value('event')]||[];if(selected.length)document.querySelectorAll('[name=column]').forEach(x=>x.checked=selected.includes(x.value))}async function createList(){try{const fields=[...document.querySelectorAll('[name=column]:checked')].map(x=>x.value);const r=await call('configuraElencoOperativo',{event_id:value('event'),fields});message(r.message,true);const a=document.createElement('a');a.className='button secondary';a.href=r.print_url;a.target='_blank';a.textContent='Apri PDF stampabile';document.getElementById('message').after(a)}catch(e){showError(e)}}
function communicationsUI(){app().innerHTML=`<h1>Comunicazioni operative</h1><p id="emailMode" class="pill yellow">Verifica modalità…</p><p class="muted">Le comunicazioni vengono preparate nel motore email WordPress. In Anteprima non parte alcun messaggio.</p><label class="field-label">Evento</label><select class="control" id="event"><option value="">Scegli…</option>${ctx.events.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select><label class="field-label">Tipo</label><select class="control" id="template"><option value="PRE_DEPARTURE_REMINDER">Promemoria prima dell’evento</option><option value="BALANCE_REMINDER">Promemoria scadenza saldo</option></select><label class="field-label">Messaggio</label><textarea class="control" id="communicationMessage" rows="7" placeholder="Punto di ritrovo, orario, cosa portare, indicazioni…"></textarea><button id="communicationButton" class="button" onclick="prepareCommunication()">Prepara in anteprima</button><div id="message"></div>`;loadCommunicationMode()}async function loadCommunicationMode(){try{const r=await call('statoComunicazioniOperative');operationalEmailMode=r.mode||'ANTEPRIMA';document.getElementById('emailMode').textContent='Modalità '+operationalEmailMode;document.getElementById('communicationButton').textContent=operationalEmailMode==='OPERATIVO'?'Accoda per l’invio':'Prepara in anteprima'}catch(e){showError(e)}}async function prepareCommunication(){const requestId=communicationRequestId;const allowOperational=operationalEmailMode==='OPERATIVO';if(allowOperational&&!confirm('La modalità è OPERATIVO: accodare questa comunicazione per l’invio reale ai destinatari selezionati?'))return;try{const r=await call('preparaComunicazioneOperativa',{request_id:requestId,event_id:value('event'),template_type:value('template'),message:value('communicationMessage'),allow_operational:allowOperational});if(communicationRequestId===requestId)communicationRequestId='comui-'+Date.now()+'-'+Math.random().toString(36).slice(2);message(r.message+' Destinatari: '+r.count+'. Modalità: '+r.mode+'.',true)}catch(e){showError(e)}}
function registrationStatus(s){return ({CONFIRMED:'Confermata',PENDING_PAYMENT:'In attesa di pagamento',WAITLISTED:'Lista d’attesa',CANCELLED:'Annullata',EXPIRED:'Scaduta',ACTIVE:'Attiva'}[String(s).toUpperCase()]||s)}function displayValue(v){if(Array.isArray(v))return v.map(displayValue).join(', ');if(v&&typeof v==='object')return Object.values(v).map(displayValue).filter(Boolean).join(', ');return String(v??'')}function readable(s){return String(s).replace(/^custom_/,'').replaceAll('_',' ').replace(/^./,c=>c.toUpperCase())}boot();
</script></body></html>
