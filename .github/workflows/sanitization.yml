name: Sanitization check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Workspace and WordPress behavior
        run: node --test workspace-apps-script/tests/*.test.mjs wordpress-plugin/tests/*.test.mjs

  sanitization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan public files
        shell: pwsh
        run: ./tools/check-sanitization.ps1
